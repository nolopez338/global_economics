<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Class Materials</title>
  <link rel="stylesheet" href="../../assets/css/schedule.css" />
  <style>
    :root {
      --material-slides: #2563eb;
      --material-classroom-activities: #15803d;
      --material-practice-activities: #b45309;
      --material-extra-resources: #7e22ce;
    }
    .grade-section + .grade-section { margin-top: 2rem; }
    .grade-section > h2 { margin-bottom: 1rem; }
    .class-section + .class-section { margin-top: 1.5rem; }
    .class-section h3 { margin: 0 0 0.75rem; color: var(--muted); }
    .materials-status { margin: 0; padding: 1rem; border: 1px solid var(--grid); border-radius: 10px; color: var(--muted); }
    body.dark-theme .materials-status { border-color: #334155; }
    .materials-legend { margin: 0 0 1rem; padding: 0; }
    .materials-legend ul { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin: 0; padding: 0; list-style: none; }
    .materials-legend li { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.875rem; }
    .material-swatch { width: 0.8rem; height: 0.8rem; border: 2px solid var(--material-accent); border-radius: 50%; background: color-mix(in srgb, var(--material-accent) 22%, transparent); }
    .material-card { border-top: 4px solid var(--material-accent); }
    .material-card .class-icon { border: 2px solid var(--material-accent); background: color-mix(in srgb, var(--material-accent) 12%, white); color: var(--material-accent); }
    .material-category { padding: 0.18rem 0.45rem; border: 1px solid var(--material-accent); border-radius: 999px; color: var(--material-accent); background: color-mix(in srgb, var(--material-accent) 8%, white); font-size: 0.72rem; font-weight: 700; }
    .material-card--slides, .material-legend--slides { --material-accent: var(--material-slides); }
    .material-card--classroom-activities, .material-legend--classroom-activities { --material-accent: var(--material-classroom-activities); }
    .material-card--practice-activities, .material-legend--practice-activities { --material-accent: var(--material-practice-activities); }
    .material-card--extra-resources, .material-legend--extra-resources { --material-accent: var(--material-extra-resources); }
    body.dark-theme {
      --material-slides: #60a5fa;
      --material-classroom-activities: #4ade80;
      --material-practice-activities: #fbbf24;
      --material-extra-resources: #c084fc;
    }
    body.dark-theme .material-card .class-icon,
    body.dark-theme .material-category { background: color-mix(in srgb, var(--material-accent) 12%, #111827); color: var(--material-accent); }
    .material-card:focus-visible { outline: 3px solid var(--material-accent); outline-offset: 3px; }
    @media (forced-colors: active) {
      .material-card, .material-card .class-icon, .material-category, .material-swatch { border-color: CanvasText; forced-color-adjust: auto; }
      .material-card:focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
<body>
  <main id="materials-page">
    <div class="breadcrumbs">
      <a class="back-link" href="../schedule-teacher.html" aria-label="Back to the main schedule">← Back to Schedule</a>
    </div>
    <h1>Class Materials</h1>
    <section class="page-card" aria-label="Class materials">
      <nav class="materials-legend" aria-label="Material categories">
        <ul>
          <li class="material-legend--slides"><span class="material-swatch" aria-hidden="true"></span>Slides</li>
          <li class="material-legend--classroom-activities"><span class="material-swatch" aria-hidden="true"></span>Classroom activities</li>
          <li class="material-legend--practice-activities"><span class="material-swatch" aria-hidden="true"></span>Practice activities</li>
          <li class="material-legend--extra-resources"><span class="material-swatch" aria-hidden="true"></span>Extra resources</li>
        </ul>
      </nav>
      <div id="materials-content" aria-live="polite">
        <p class="materials-status">Loading materials…</p>
      </div>
    </section>
    <section class="theme-toggle-section" aria-label="Theme controls">
      <label class="theme-toggle" for="dark-mode-toggle">
        <span class="theme-toggle-label">Dark mode</span>
        <span class="theme-toggle-control">
          <input type="checkbox" id="dark-mode-toggle" aria-label="Toggle dark mode">
          <span class="theme-toggle-slider" aria-hidden="true"></span>
        </span>
      </label>
    </section>
  </main>
  <script src="../assets/js/databases/materials-data-base.js"></script>
  <script src="../assets/js/databases/materials-data.js"></script>
  <script src="../assets/js/materials-validation.js"></script>
  <script src="../assets/js/materials-page.js" defer></script>
  <script src="../assets/js/theme-toggle.js" defer></script>
</body>
</html>
