<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../../assets/png/icon_calendar.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Exam Instructions</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      --class-timer-size: min(clamp(72px, 14vw, 168px), calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), 30vh);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      padding-top: calc(var(--class-timer-size) + 32px + env(safe-area-inset-top, 0px));

      background: #0b0d10;
      color: #f5f7fa;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .class-timer {
      position: fixed;
      top: var(--class-timer-center, calc(16px + env(safe-area-inset-top, 0px)));
      right: calc(16px + env(safe-area-inset-right, 0px));
      width: var(--class-timer-size);
      height: var(--class-timer-size);
      transform: translateY(-50%);
      z-index: 1000;
      border: 2px solid #292f36;
      border-radius: 50%;
      background: conic-gradient(from 0turn,
        #a5adb7 0 var(--progress, 0%),
        #1a1e23 var(--progress, 0%) 100%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    .card {
      padding: clamp(28px, 4vw, 48px);
      border: 1px solid #272c33;
      border-radius: 20px;

      background: #13161a;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      margin-bottom: 8px;

      color: #a5adb7;
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 26px;

      font-size: clamp(3.2rem, 8vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .instructions {
      display: grid;
      gap: 12px;
    }

    .instruction {
      display: flex;
      align-items: center;
      gap: 20px;

      padding: 22px 24px;
      border-radius: 15px;

      background: #1a1e23;
      border: 1px solid #292f36;

      font-size: clamp(1.5rem, 3.5vw, 2rem);
      line-height: 1.3;
    }

    .number {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background: #f5f7fa;
      color: #0b0d10;

      font-size: 1.25rem;
      font-weight: 900;
    }

    .important {
      margin-top: 8px;

      background: #f5f7fa;
      color: #0b0d10;
      border-color: #f5f7fa;

      font-weight: 900;
    }

    .footer {
      margin-top: 16px;

      color: #a5adb7;
      font-size: 1.15rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
        padding-top: calc(var(--class-timer-size) + 32px + env(safe-area-inset-top, 0px));
      }

      .card {
        padding: 24px 16px;
        border-radius: 16px;
      }

      .eyebrow {
        font-size: 0.95rem;
      }

      h1 {
        margin-bottom: 22px;
        font-size: 3rem;
      }

      .instruction {
        gap: 14px;
        padding: 18px 16px;
        font-size: 1.35rem;
      }

      .number {
        flex-basis: 40px;
        width: 40px;
        height: 40px;
        font-size: 1.05rem;
      }

      .footer {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div id="class-timer" class="class-timer" aria-hidden="true" hidden></div>
  <main class="container">
    <section class="card">

      <div class="eyebrow">In order to begin:</div>

      <h1>Exam Instructions</h1>

      <div class="instructions">

        <div class="instruction">
          <span class="number">1</span>
          <span>Take a <strong>white exam sheet</strong>.</span>
        </div>

        <div class="instruction">
          <span class="number">2</span>
          <span>Place your <strong>backpack at the front</strong>.</span>
        </div>

        <div class="instruction">
          <span class="number">3</span>
          <span>
            Make sure you have your
            <strong>notebook, pencil case, and calculator</strong>
            ready.
          </span>
        </div>

        <div class="instruction important">
          <span class="number">!</span>
          <span>READ THE INSTRUCTIONS CAREFULLY.</span>
        </div>

      </div>

      <div class="footer">
        Make sure you're ready before starting.
      </div>

    </section>
  </main>
  <script src="../assets/js/databases/year-calendar-data.js"></script>
  <script src="../assets/js/school-day-timer.js"></script>
  <script>
    (function () {
      "use strict";
      const visual = document.getElementById("class-timer");
      const heading = document.querySelector("h1");
      const { periods, progress } = window.SchoolDayTimer;

      function alignClock() {
        const bounds = heading.getBoundingClientRect();
        visual.style.setProperty("--class-timer-center", (bounds.top + bounds.height / 2) + "px");
      }

      // Keep the fixed clock aligned as the heading moves or wraps.
      const layoutObserver = new ResizeObserver(alignClock);
      layoutObserver.observe(document.body);
      layoutObserver.observe(heading);
      window.addEventListener("resize", alignClock);
      window.addEventListener("scroll", alignClock, { passive: true });
      document.fonts.ready.then(alignClock);
      alignClock();

      function update(now = new Date()) {
        const dateKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
        let info = null;
        try {
          info = window.academicCalendar?.getAcademicDateInfo(dateKey) || null;
        } catch (error) {
          console.warn("School calendar data is unavailable for this date.", error);
        }
        const weekend = now.getDay() === 0 || now.getDay() === 6;
        const validCycleDay = Number.isInteger(info?.cycleDay) && info.cycleDay >= 1 && info.cycleDay <= 6;
        visual.hidden = weekend || Boolean(info?.isHoliday) || !validCycleDay;
        if (visual.hidden) return;

        const minutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60 + now.getMilliseconds() / 60000;
        // Keep the completed period filled during transitions and after school.
        const period = periods.findLast((item) => minutes >= item.start) || periods[0];
        visual.style.setProperty("--progress", (progress(period.start, period.end, minutes) * 100) + "%");
      }

      update();
      window.setInterval(update, 250);
      document.addEventListener("visibilitychange", () => update());
      window.addEventListener("focus", () => update());
    })();
  </script>
</body>
</html>
