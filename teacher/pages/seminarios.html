<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seminarios</title>
  <link rel="stylesheet" href="../../assets/css/schedule.css" />
</head>
<body>
  <main id="seminarios-page">
    <div class="breadcrumbs">
      <a class="back-link" href="../schedule.html" aria-label="Back to the main schedule">← Back to Schedule</a>
    </div>
    <h1>Seminarios</h1>
    <p>This page corresponds to Seminarios in the weekly schedule.</p>
    <section class="page-card" aria-label="Seminarios resources">
      <h2>Resources</h2>
      <div class="class-grid"></div>
    </section>
    <section class="theme-toggle-section" aria-label="Theme controls">
      <label class="theme-toggle" for="dark-mode-toggle">
        <span class="theme-toggle-label">Dark mode</span>
        <span class="theme-toggle-control">
          <input type="checkbox" id="dark-mode-toggle" aria-label="Toggle dark mode">
          <span class="theme-toggle-slider" aria-hidden="true"></span>
        </span>
      </label>
    </section>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var access = params.get("access") === "teacher" ? "teacher" : "public";
      var origin = params.get("origin");
      var backHref = origin === "schedule-teacher" ? "../schedule-teacher.html" : "../schedule.html";
      var main = document.getElementById("seminarios-page");

      if (main) {
        main.dataset.access = access;
      }

      document.querySelectorAll(".back-link").forEach(function (link) {
        link.href = backHref;
      });

      // Match the class pages' public/teacher URL mode pattern, adapted to access=teacher.
      document.querySelectorAll("[data-teacher-only]").forEach(function (item) {
        item.hidden = access !== "teacher";
      });
    })();
  </script>
  <script src="../assets/js/theme-toggle.js" defer></script>
</body>
</html>
