<!doctype html>
<html lang="en">
<head>
  <link type="image/svg+xml" sizes="any" rel="icon" href="../../assets/svg/icon_calendar.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class View</title>
  <link rel="stylesheet" href="../../assets/css/countdown_timer.css">
  <link rel="stylesheet" href="../assets/css/class-view.css">
</head>
<body>
  <main class="class-view">
    <header class="class-view-header">
      <a id="return-link" class="return-link" href="../schedule.html">← Schedule</a>
      <time id="live-clock" class="live-clock" aria-label="Current time"></time>
      <div class="class-view-controls">
        <div class="presentation-controls" role="group" aria-label="Numbered presentations: fullscreen or minimal on top, fit window below">
          <button id="fullscreen-toggle" class="icon-button" type="button" aria-label="Presentation 1: fullscreen the clock" title="Presentation 1: fullscreen the clock" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><text class="presentation-index" x="12" y="12.5">1</text></svg>
          </button>
          <button id="minimal-toggle" class="icon-button" type="button" aria-label="Presentation 2: show the minimal clock (windowed)" title="Presentation 2: show the minimal clock (windowed)" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><text class="presentation-index" x="12" y="12.5">2</text></svg>
          </button>
          <button id="page-fullscreen-toggle" class="icon-button" type="button" aria-label="Presentation 3: fullscreen the whole page" title="Presentation 3: fullscreen the whole page" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><text class="presentation-index" x="12" y="12.5">3</text></svg>
          </button>
          <button id="resize-clock" class="icon-button" type="button" aria-label="Resize 1: show the clock and fit this browser window" title="Resize 1: show the clock and fit this browser window" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="m5 5 3 3H5m3 0V5m11 0-3 3h3m-3 0V5M5 19l3-3H5m3 0v3m11 0-3-3h3m-3 0v3"/><text class="presentation-index" x="12" y="12.5">1</text></svg>
          </button>
          <button id="resize-minimal" class="icon-button" type="button" aria-label="Resize 2: show the minimal clock and fit this browser window" title="Resize 2: show the minimal clock and fit this browser window" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="m5 5 3 3H5m3 0V5m11 0-3 3h3m-3 0V5M5 19l3-3H5m3 0v3m11 0-3-3h3m-3 0v3"/><text class="presentation-index" x="12" y="12.5">2</text></svg>
          </button>
          <button id="resize-page" class="icon-button" type="button" aria-label="Resize 3: show the whole page and fit this browser window" title="Resize 3: show the whole page and fit this browser window" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="m5 5 3 3H5m3 0V5m11 0-3 3h3m-3 0V5M5 19l3-3H5m3 0v3m11 0-3-3h3m-3 0v3"/><text class="presentation-index" x="12" y="12.5">3</text></svg>
          </button>
        </div>
        <button id="timer-toggle" class="icon-button" type="button" aria-label="Set countdown timer" title="Set countdown timer" aria-pressed="false" aria-haspopup="dialog" aria-controls="timer-dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <label class="theme-control">
          <span>Dark mode</span>
          <input type="checkbox" id="dark-mode-toggle" aria-label="Toggle dark mode">
        </label>
      </div>
    </header>

    <div class="presentation-toolbar" hidden>
      <button id="presentation-exit" class="control-button" type="button" title="Return to the full page (Escape)">← Return</button>
    </div>

    <section class="status" aria-live="polite">
      <p id="cycle-label" class="cycle-label"></p>
      <h1 id="activity-title">Loading schedule…</h1>
      <p id="next-activity" class="next-activity" aria-atomic="true" hidden></p>
      <p id="countdown" class="countdown"></p>
    </section>

    <div class="visual-stage">
      <section id="block-visual" class="block-visual circular-progress schedule-visual" data-period-state="general" aria-label="Current schedule block">
        <time id="block-end" class="progress-time-label"></time>
        <div id="elapsed-fill" class="elapsed-fill" aria-hidden="true"></div>
        <div id="time-line" class="time-line" aria-hidden="true"></div>
        <div class="time-line-pin" aria-hidden="true"></div>
        <span id="block-remaining" class="minimal-remaining"></span>
      </section>

      <section id="timer-visual" class="block-visual circular-progress timer-visual" aria-label="Countdown timer" hidden>
        <time id="timer-duration" class="progress-time-label"></time>
        <div id="timer-elapsed-fill" class="elapsed-fill" aria-hidden="true"></div>
        <div id="timer-line" class="time-line" aria-hidden="true"></div>
        <div class="time-line-pin" aria-hidden="true"></div>
        <span id="timer-remaining" class="minimal-remaining"></span>
      </section>
    </div>
    <p id="presentation-message" class="presentation-message" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>

  <dialog id="timer-dialog" class="timer-dialog">
    <form id="timer-form" method="dialog">
      <h2>Set countdown timer</h2>
      <div class="timer-fields">
        <label>Minutes <input id="timer-minutes" type="number" min="0" max="999" value="5" inputmode="numeric"></label>
        <label>Seconds <input id="timer-seconds" type="number" min="0" max="59" value="0" inputmode="numeric"></label>
      </div>
      <p id="timer-error" class="timer-error" role="alert" hidden>Enter a timer longer than zero seconds.</p>
      <div class="dialog-actions">
        <button value="cancel" type="button" id="timer-cancel">Cancel</button>
        <button value="start" type="submit">Start timer</button>
      </div>
    </form>
  </dialog>

  <iframe id="schedule-source" title="Schedule data" hidden></iframe>
  <script src="../assets/js/databases/year-calendar-data.js"></script>
  <script src="../../assets/js/countdown_timer.js"></script>
  <script src="../assets/js/class-view.js"></script>
  <script src="../assets/js/theme-toggle.js"></script>
</body>
</html>
