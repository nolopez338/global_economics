<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class View</title>
  <link rel="stylesheet" href="../assets/css/countdown_timer.css">
  <link rel="stylesheet" href="./assets/css/class-view.css">
</head>
<body>
  <main class="class-view">
    <header class="class-view-header">
      <a id="return-link" class="return-link" href="./schedule.html">← Schedule</a>
      <time id="live-clock" class="live-clock" aria-label="Current time"></time>
      <div class="class-view-controls">
        <button id="fullscreen-toggle" class="fullscreen-toggle" type="button">Fullscreen</button>
        <button id="timer-toggle" class="control-button" type="button" aria-pressed="false">Timer</button>
        <label class="theme-control">
          <span>Dark mode</span>
          <input type="checkbox" id="dark-mode-toggle" aria-label="Toggle dark mode">
        </label>
      </div>
    </header>

    <section class="status" aria-live="polite">
      <p id="cycle-label" class="cycle-label"></p>
      <h1 id="activity-title">Loading schedule…</h1>
      <p id="next-activity" class="next-activity" aria-atomic="true" hidden></p>
      <p id="countdown" class="countdown"></p>
    </section>

    <section id="block-visual" class="block-visual circular-progress schedule-visual" data-period-state="general" aria-label="Current schedule block">
      <time id="block-end" class="progress-time-label"></time>
      <div id="elapsed-fill" class="elapsed-fill" aria-hidden="true"></div>
      <div id="time-line" class="time-line" aria-hidden="true"></div>
      <div class="time-line-pin" aria-hidden="true"></div>
    </section>

    <section id="timer-visual" class="block-visual circular-progress timer-visual" aria-label="Countdown timer" hidden>
      <time id="timer-duration" class="progress-time-label"></time>
      <div id="timer-elapsed-fill" class="elapsed-fill" aria-hidden="true"></div>
      <div id="timer-line" class="time-line" aria-hidden="true"></div>
      <div class="time-line-pin" aria-hidden="true"></div>
    </section>
  </main>

  <dialog id="timer-dialog" class="timer-dialog">
    <form id="timer-form" method="dialog">
      <h2>Set countdown timer</h2>
      <div class="timer-fields">
        <label>Minutes <input id="timer-minutes" type="number" min="0" max="999" value="5" inputmode="numeric"></label>
        <label>Seconds <input id="timer-seconds" type="number" min="0" max="59" value="0" inputmode="numeric"></label>
      </div>
      <p id="timer-error" class="timer-error" role="alert" hidden>Enter a timer longer than zero seconds.</p>
      <div class="dialog-actions">
        <button value="cancel" type="button" id="timer-cancel">Cancel</button>
        <button value="start" type="submit">Start timer</button>
      </div>
    </form>
  </dialog>

  <iframe id="schedule-source" title="Schedule data" hidden></iframe>
  <script src="./assets/js/databases/year-calendar-data.js"></script>
  <script src="../assets/js/countdown_timer.js"></script>
  <script src="./assets/js/class-view.js"></script>
  <script src="./assets/js/theme-toggle.js"></script>
</body>
</html>
