const $ = id => document.getElementById(id);
const fmt = (x,d=3) => Number.isFinite(x) ? x.toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:0}) : 'undefined';
const eq = tex => `<div class="equation" data-math="${tex.replace(/"/g,'&quot;')}"></div>`;

const lessons = [
{id:'start',num:'Start',title:'A path from primes to a profound question',objective:'Know what you need before starting, and how to use this course.',intro:'Prime numbers are simple to define. Their collective behavior leads to one of the deepest open questions in mathematics. We will build that question one idea at a time.',body:`
<h2>What you should already know</h2><p>The <strong>essential path</strong> assumes basic arithmetic, fractions, powers such as ${m('2^3=8')}, and simple algebra: substituting a value into a formula and reading a graph. You do not need prior knowledge of logarithms, calculus, infinite series, or complex numbers; these are introduced before use.</p>
<h2>Two levels, one journey</h2><p><strong>Essential:</strong> read the main explanations, work through the examples, explore the controls, and answer the checkpoints. Expect about 90–120 minutes, or several shorter sessions.</p><p><strong>Optional depth:</strong> expand the panels for proofs, complex analysis, and error estimates. Their prerequisites are listed locally. They are not required to understand the statement of the hypothesis. Some advanced theorems are explained and cited rather than proved here.</p>
<p>The persistent menu lets you revisit any idea. Previous and Next follow the prerequisite order. Progress measures your current position; the separate checkpoint count measures correct answers in this session.</p>
${note('<strong>A convention to watch:</strong> π(x) counts primes; the standalone constant π ≈ 3.14159 measures circles. The notation looks similar but the meanings differ. A theorem is proved; a conjecture is proposed and unproved.')}
${viz('Check your starting tools',`<p>Tick the skills you feel comfortable using. This is a self-check, not a gate.</p><div class="prechecks"><label><input type="checkbox" class="ready">I can add and multiply fractions.</label><label><input type="checkbox" class="ready">I understand positive integer powers, such as 3² = 9.</label><label><input type="checkbox" class="ready">I can substitute x = 4 into x(x + 1)/2.</label><label><input type="checkbox" class="ready">I can read horizontal and vertical coordinates on a graph.</label></div><p id="ready-out" role="status">0 of 4 starting tools checked.</p>`)}
${optional('A short prerequisite refresher',`<p>A reciprocal is ${m('1/n')}; a negative power means ${m('n^{-2}=1/n^2')}. A square root ${m('\\sqrt{x}')} is the nonnegative number whose square is x. A function assigns an output to each allowed input; its domain is the set of allowed inputs. The graph of y = f(x) plots each pair (x, f(x)).</p>${ex('Substitution',`<p>At x = 4, ${m('x(x+1)/2=4\\cdot5/2=10')}. At n = 2, ${m('1/n^2=1/4')}. On a graph, the point (4, 10) means input 4 gives output 10.</p>`)}`)}
`,question:'How are prime numbers distributed among the integers?',check:{q:'What is needed to begin the essential path?',options:['A prior course in complex analysis.','Basic arithmetic, powers, algebra, and graph reading.','A proof of the Prime Number Theorem.'],correct:1,why:'The advanced ideas are introduced in sequence. Optional proofs can require calculus or complex analysis, but the main path does not assume them.'}},
{id:'primes',num:'1',title:'Prime numbers: the building blocks',objective:'Recognize primes and explain unique prime factorization.',intro:'A house can be assembled from bricks. Multiplication builds every integer greater than 1 from primes.',body:`
<p>A <strong>prime</strong> is an integer greater than 1 whose only positive divisors are 1 and itself. Thus 2, 3, 5, 7, 11 are prime. A <strong>composite</strong> integer greater than 1 has other divisors: 12 = 3 × 4. The number 1 is neither prime nor composite.</p>
<h2>A theorem about every integer</h2><p>The <strong>fundamental theorem of arithmetic</strong> says that every integer greater than 1 is a product of primes, uniquely up to the order of the factors. This makes primes the multiplicative building blocks of positive integers.</p>
${ex('Taking 60 apart',eq('60=6\\cdot10=(2\\cdot3)(2\\cdot5)=2^2\\cdot3\\cdot5')+'<p>Starting instead with 60 = 4 × 15 gives the same primes with the same multiplicities. A different order does not give a different factorization.</p>')}
<p>Prime gaps vary: 11 and 13 are two apart; 23 and 29 are six apart. There is no constant spacing or repeating prime/composite pattern. This irregularity does <em>not</em> mean primes are random: divisibility determines them exactly.</p><p>Mathematicians ask both local questions (where is the next prime?) and global questions (how many are below a large bound?). As numbers grow, the <em>long-run proportion</em> that are prime tends to zero, even though there are infinitely many primes. Individual blocks need not get steadily sparser.</p>
${viz('A moving window on the integers',`<div class="controls">${range('prime-block','First integer in a block of 100',1,9901,1,100)}</div><div id="prime-grid" class="prime-grid" aria-label="Integer grid; primes explicitly labeled"></div><div class="readout" id="prime-stats" aria-live="polite"></div><p class="caption">Filled teal cells are prime; pale cells are composite (except 1). Compare distant windows. The trend is statistical, not monotone from block to block.</p>`)}
${optional('Why there must be infinitely many primes','<p>No calculus required. Suppose p₁, …, pₖ were all primes. Their product plus 1 has remainder 1 when divided by any prime on that list. It is greater than 1, so it has a prime divisor, which cannot be on the list. Contradiction. The new number need not itself be prime.</p>')}
`,question:'Can we turn “how many primes?” into a mathematical function?',check:{q:'Why is 1 excluded from the primes?',options:['It is even.','Allowing it would destroy uniqueness by permitting arbitrarily many factors of 1.','It has too many positive divisors.'],correct:1,why:'For example, 6 = 2 × 3 = 1 × 2 × 3 = 1 × 1 × 2 × 3. Excluding 1 keeps the factorization unique up to order.'}},
{id:'counting',num:'2',title:'Counting primes, one jump at a time',objective:'Read and calculate the prime-counting function π(x).',intro:'Instead of predicting the next prime, count all primes up to a moving boundary.',body:`
${eq('\\pi(x)=\\#\\{p\\le x:p\\text{ is prime}\\}')}
<p>The symbol # means “number of elements.” The input x can be real: π(10.5) still counts the primes 2, 3, 5, 7. This is a <strong>staircase function</strong>: it jumps by 1 exactly when x reaches a prime, and stays flat between consecutive primes. At a prime, that prime is already included.</p>
${ex('An inclusive boundary',`<p>π(10) = 4 because 2, 3, 5, 7 are at most 10. Then π(11) = 5, and π(12) = 5. The step at 11 includes 11 itself.</p>`)}
<p>Although π(x) grows without bound, its average growth per integer gradually decreases. Flat portions become longer on average. Directly testing every candidate is costly at enormous x; a sieve marks multiples efficiently, and sophisticated exact counting algorithms can avoid checking every integer individually. Even so, exact counts at very large scales require substantial computation.</p>
${viz('Move the counting boundary',`<div class="controls">${range('count-x','Boundary x',2,200,50)}</div>${chartHost('count-chart')}<div id="count-out" class="readout" aria-live="polite"></div><div id="count-primes" class="generated" aria-label="Primes included in the count"></div><p class="caption">Exact staircase on 0 ≤ x ≤ 200. Vertical guide: your boundary. Listed primes are exactly those included.</p>`)}
`,question:'Can we predict the number of primes below x without checking every integer?',check:{q:'What happens to π(x) as x moves from 13 to 16?',options:['It increases by 3.','It stays at 6.','It decreases because the primes get sparser.'],correct:1,why:'The primes at most 13 are 2, 3, 5, 7, 11, 13. There is no new prime before 17, so π(13) = π(16) = 6.'}},
{id:'pnt',num:'3',title:'A predictable trend beneath the irregularity',objective:'Interpret asymptotic equivalence and compare two prime-count estimates.',intro:'An exact staircase can have a smooth long-run trend. The Prime Number Theorem identifies that trend.',body:`
<h2>First, what is ln(x)?</h2><p>The <strong>natural logarithm</strong> answers “what power of e gives x?”, where e ≈ 2.71828. Thus ln(e) = 1 and ln(e²) = 2. It grows slowly: ln(10) ≈ 2.303, ln(100) ≈ 4.605. Its input must be positive. Equivalently, ln(x) is the signed area under 1/t between 1 and x.</p>
<p>The <strong>Prime Number Theorem</strong> is a proved statement:</p>${eq('\\pi(x)\\sim\\frac{x}{\\ln x}\\quad(x\\to\\infty),\\qquad\\frac{\\pi(x)}{x/\\ln x}\\to1.')}
<p>The symbol ∼ means the <em>ratio tends to 1</em>, not that the two quantities become exactly equal or their difference tends to zero. The estimate suggests a typical prime density near a large x of about 1/ln(x), understood as a trend over suitable intervals rather than a probability assigned to one fixed integer.</p>
<h2>A changing density gives a better estimate</h2><p>Adding the smoothly changing density 1/ln(t) over an interval means taking its <strong>integral</strong>, an area accumulated under a curve. We use this convention:</p>${eq('\\operatorname{Li}_2(x)=\\int_2^x\\frac{dt}{\\ln t}.')}
<p>Throughout this course, Li₂ is the user-requested Li(x) with lower limit 2. The common principal-value convention li(x) instead integrates from 0 across the singularity at 1; it satisfies li(x) = Li₂(x) + li(2), where li(2) ≈ 1.045164. This constant does not affect the asymptotic statements.</p><p>Li₂ usually improves the estimate in the displayed range, but is not guaranteed closer at every x. Both approximations are smooth, noninteger predictions, not exact counts.</p>
${ex('At x = 100',`<p>π(100) = 25, while 100/ln(100) ≈ 21.715 and Li₂(100) ≈ 29.081. Here the simpler estimate is closer: absolute errors are about 3.285 and 4.081. Relative errors divide by the actual count, giving about 13.14% and 16.32%.</p>`)}
${viz('Compare the staircase with the trend',`<div class="controls">${range('pnt-x','Compare at x',10,10000,1000,10)}</div>${chartHost('pnt-chart')}<div id="pnt-table" class="table-wrap" aria-live="polite"></div><p class="caption">Exact sieve counts up to 10,000. Li₂ uses numerical Simpson integration; displayed estimates are rounded to 3 decimals. Relative error = |estimate − π(x)| / π(x). Plot samples are connected; see Step 2 for individual staircase jumps.</p>`)}
${optional('Why the integral beats a frozen density asymptotically',`<p>Prerequisite: differentiation and integration by parts. Differentiating x/ln(x) gives 1/ln(x) − 1/ln²(x). Consequently,</p>${eq('\\operatorname{Li}_2(x)=\\frac{x}{\\ln x}-\\frac{2}{\\ln2}+\\int_2^x\\frac{dt}{\\ln^2t}.')}<p>Repeated integration by parts gives an asymptotic expansion with further terms x/ln²(x), 2x/ln³(x), and so on. The PNT alone does not prove the stronger accuracy statements about Li₂; those require finer zero-free information about zeta.</p>`)}
`,question:'How precisely can we predict the distribution of primes?',check:{q:'What does π(x) ∼ x/ln(x) actually claim?',options:['Their difference tends to zero.','They agree for all sufficiently large x.','Their ratio tends to 1 as x grows without bound.'],correct:2,why:'Asymptotic equivalence is a statement about ratios. Absolute error can grow while relative error tends to zero.'}},
{id:'series',num:'4',title:'When does an infinite sum mean a number?',objective:'Distinguish convergence from divergence using partial sums.',intro:'An infinite sum is not an instruction to finish infinitely many additions. It is a limit of finite calculations.',body:`
<p>For terms aₙ, define the <strong>partial sum</strong> ${m('S_N=\\sum_{n=1}^N a_n')}. The symbol Σ means “add the indicated terms.” The infinite series <strong>converges</strong> to L if Sₙ tends to the finite number L: we can make |Sₙ − L| as small as desired by taking N sufficiently large. Otherwise it <strong>diverges</strong>.</p>
<h2>Small terms are necessary, but not enough</h2><p>If a series converges, its terms approach zero. The converse fails. For the <strong>harmonic series</strong>, each block below adds at least 1/2:</p>${eq('1+\\frac12+\\underbrace{\\left(\\frac13+\\frac14\\right)}_{\\ge1/2}+\\underbrace{\\left(\\frac15+\\cdots+\\frac18\\right)}_{\\ge1/2}+\\cdots')}<p>There are infinitely many such blocks. Their partial sums exceed any fixed bound, so the harmonic series diverges, despite 1/n → 0.</p>
<p>Reciprocal squares shrink faster. Their partial sums converge; Euler proved the exact value</p>${eq('\\sum_{n=1}^{\\infty}\\frac1{n^2}=\\frac{\\pi^2}{6}\\approx1.644934.')}
${ex('Four terms are not the whole sum',`<p>For squares, S₄ = 1 + 1/4 + 1/9 + 1/16 ≈ 1.423611. This is below the limiting value. For the harmonic series, S₄ ≈ 2.083333; slowing growth is not the same as approaching a finite limit.</p>`)}
<p>For real exponent s, the <strong>p-series test</strong> says ${m('\\sum n^{-s}')} converges exactly when s > 1. At s = 1 it diverges slowly; below 1 it also diverges. A finite graph cannot prove either outcome.</p>
${viz('Turn the exponent, watch the partial sums',`<div class="controls">${range('series-s','Real exponent s',0,3,2,.05)}${range('series-n','Number of terms N',10,2000,200,10)}</div>${chartHost('series-chart')}<div id="series-out" aria-live="polite"></div><div class="legend"><span>Teal solid: selected exponent</span><span>Blue dashed: harmonic (s = 1)</span><span>Amber dotted: reciprocal squares (s = 2)</span></div><p class="caption">All curves show finite partial sums, on a common vertical scale. The convergence classification comes from the p-series theorem, not from how flat a curve looks.</p>`)}
${optional('Proving the threshold with an integral',`<p>Prerequisite: elementary calculus. For real s > 0, t⁻ˢ is positive and decreasing. Rectangle comparisons show that the sum and ${m('\\int_1^\\infty t^{-s}dt')} converge or diverge together. The integral is finite precisely when s > 1. If s ≤ 0, terms fail even to approach zero.</p><p>For s > 1, the tail after N terms satisfies</p>${eq('\\frac{(N+1)^{1-s}}{s-1}\\le\\sum_{n=N+1}^{\\infty}n^{-s}\\le\\frac{N^{1-s}}{s-1}.')}<p>This proves convergence of reciprocal squares without proving Euler’s exact evaluation.</p>`)}
`,question:'What happens when we systematically change the exponent in an infinite series?',check:{q:'The terms of a series approach zero. What can we conclude?',options:['The series necessarily converges.','We still need to examine its partial sums.','Its sum is zero.'],correct:1,why:'The harmonic series is a counterexample: its terms tend to zero but its partial sums grow without bound.'}},
{id:'zeta',num:'5',title:'Meet the Riemann zeta function',objective:'Understand the series definition of ζ and its real behavior for s > 1.',intro:'Give the exponent a name, and treat the resulting sum as a function.',body:`
${eq('\\zeta(s)=\\sum_{n=1}^{\\infty}\\frac1{n^s}\\qquad(s>1\\text{ for real }s).')}
<p>The Greek letter ζ is “zeta.” We already know ζ(2) = π²/6. Also ζ(4) = π⁴/90 ≈ 1.082323. Increasing real s makes every term after the first smaller, so ζ(s) decreases toward 1. As s approaches 1 from above, ζ(s) grows without bound.</p>
<p>For complex inputs, introduced in Step 7, the same series initially defines ζ(s) in the region ${m('\\operatorname{Re}(s)>1')}. Re(s) means the real part; for a real input it is just s. The domain restriction is part of the definition, not fine print.</p>
${ex('Why near 1 is difficult',`<p>At s = 2, the missing tail after N terms is at most 1/N. At s = 1.1, the corresponding bound is ${m('10N^{-0.1}')}. With N = 1,000 it is about 5.012, so a thousand terms can still miss a great deal.</p>`)}
${viz('The function and a finite approximation',`<div class="controls">${range('zeta-s','Real input s',1.05,5,2,.05)}${range('zeta-n','Partial sum terms N',10,2000,200,10)}</div>${chartHost('zeta-chart')}<div id="zeta-out" class="readout" aria-live="polite"></div><p class="caption">Teal: ζ(s), numerically evaluated with a tail correction. Blue dashed: the N-term sum. The curve begins at 1.05; the pole at 1 is outside the plotted interval. Reference values are displayed to 6 decimals.</p>`)}
<p>Why this function? It collects multiplicative information about <em>all</em> positive integers. Unique factorization will turn that information into a statement about primes.</p>
`,question:'Why would a function built from all positive integers tell us anything about prime numbers?',check:{q:'For the original real series, what is ζ(1)?',options:['The series diverges, so it defines no finite value there.','It is 1.','It is −1/12.'],correct:0,why:'At s = 1 the series is harmonic. Later continuation also has a pole at 1; it does not assign a finite value there.'}},
{id:'euler',num:'6',title:'Euler’s product: primes inside zeta',objective:'Explain why multiplying prime factors reproduces the zeta series.',intro:'A sum over all integers can be rebuilt as a product over primes. Unique factorization is the bridge.',body:`
<h2>One factor, all powers of one prime</h2><p>The <strong>geometric series identity</strong> is ${m('1+r+r^2+\\cdots=1/(1-r)')} for |r| < 1. For a prime p, set r = p⁻ˢ. The factor becomes</p>${eq('\\frac1{1-p^{-s}}=1+p^{-s}+p^{-2s}+p^{-3s}+\\cdots.')}<p>When we multiply these factors for every prime, choosing one term from each factor generates an integer’s prime factorization:</p>${eq('\\zeta(s)=\\prod_{p\\text{ prime}}\\frac1{1-p^{-s}},\\qquad\\operatorname{Re}(s)>1.')}
${ex('Only the factors for 2 and 3',`${eq('(1+2^{-s}+4^{-s}+\\cdots)(1+3^{-s}+9^{-s}+\\cdots)')}<p>These generate reciprocals of 1, 2, 3, 4, 6, 8, 9, 12, … raised to s. For example, the choices 4⁻ˢ and 3⁻ˢ give 12⁻ˢ. But 5⁻ˢ is missing until the prime 5 joins the product.</p>`)}
<p>Unique factorization guarantees that every integer appears exactly once in the full expansion. Absolute convergence when Re(s) > 1 justifies rearranging and multiplying these infinite expressions. A finite product still contains <em>infinitely many prime powers</em>; it is not the same as summing only the first few integers.</p>
${viz('Build the product from prime factors',`<div class="controls">${range('euler-k','Number of prime factors',1,10,2)}${range('euler-s','Real exponent s',1.2,4,2,.1)}</div><div id="euler-factors"></div><details><summary>Expand the selected geometric factors</summary><div id="euler-expansion" class="table-wrap"></div></details><div id="euler-out" class="readout" aria-live="polite"></div><h3>Generated integers up to 100</h3><div id="euler-generated" class="generated"></div><p class="caption">The product evaluates each geometric factor completely. The integer list is only a finite illustration of its expansion. Add primes to include previously missing factorizations.</p>`)}
${optional('Why the product has no zeros in its domain',`<p>Prerequisites: absolute convergence and complex logarithms. Nonzero individual factors alone do not guarantee a nonzero infinite product. Here ${m('\\sum_p |p^{-s}|<\\infty')} for Re(s) > 1, so the logarithmic expansion converges absolutely. Its exponential is nonzero. This establishes ζ(s) ≠ 0 throughout that half-plane.</p>`)}
`,question:'How does the zeta function encode information about every prime number?',check:{q:'With factors for 2 and 3 only, which denominator is missing?',options:['12','18','10'],correct:2,why:'10 = 2 × 5 needs the factor for prime 5. In contrast 12 = 2² × 3 and 18 = 2 × 3² are generated by 2 and 3.'}},
{id:'continuation',num:'7',title:'Beyond the series: a complex landscape',objective:'Read complex inputs and distinguish a function from one formula defining it.',intro:'A formula can stop working even when the function it describes has a meaningful extension.',body:`
<h2>Two coordinates make one number</h2><p>A <strong>complex number</strong> is ${m('s=a+bi')}, where ${m('i^2=-1')}. Its real part is a and its imaginary part is b. Plot it at (a, b) in the complex plane. A real number lies on the horizontal axis. For example 2 + 3i is two units right and three units up. Its <strong>magnitude</strong> (or absolute value) is its distance from the origin: ${m('|a+bi|=\\sqrt{a^2+b^2}')}.</p><p>A complex function takes one point as input and returns another point as output. Complex exponentiation combines size and rotation. The functions cos(θ) and sin(θ) are the horizontal and vertical coordinates on the unit circle at angle θ; angles are measured in radians, with a full turn equal to 2π. Euler’s identity ${m('e^{i\\theta}=\\cos\\theta+i\\sin\\theta')} expresses that rotation. For a positive integer n, define ${m('n^{-s}=e^{-s\\ln n}')}. With s = a + bi, this equals ${m('n^{-a}(\\cos(b\\ln n)-i\\sin(b\\ln n))')}: shrinking size multiplied by a rotating direction. Its magnitude is n⁻ᵃ.</p>
<p>Consequently, the zeta series converges absolutely when a > 1, by the real p-series test. Its ordinary partial sums do not converge when a ≤ 1. Thus we cannot simply use that series everywhere.</p>
<h2>Extend the function, not the permission to add</h2><p>A complex function is <strong>analytic</strong> on a region if it has a complex derivative at every point there; locally it can be represented by a convergent power series. This is a strong compatibility condition, much more restrictive than drawing a smooth-looking surface.</p><p><strong>Analytic continuation</strong> extends an analytic function through overlapping regions while preserving its values on overlaps. The identity theorem guarantees uniqueness on connected regions. It is a theorem that ζ extends to every complex input except s = 1, where it has a <strong>simple pole</strong>: locally it behaves like 1/(s − 1). The term <em>meromorphic</em> allows such isolated poles.</p>
${ex('A simpler continuation',`<p>The geometric series 1 + z + z² + … equals 1/(1 − z) only for |z| < 1. The rational function 1/(1 − z) is also defined at z = 2, giving −1. That does not make 1 + 2 + 4 + … an ordinarily convergent sum. A function can extend beyond a particular series representation.</p>`)}
${viz('Select a complex input',`<p>Use the sliders, or click the map. The vertical coordinate is Im(s), not the output of ζ.</p><div class="controls">${range('complex-a','Real part a',-3,3,.5,.05)}${range('complex-b','Imaginary part b',-30,30,14.15,.05)}</div><div class="complex-view"><canvas id="complex-map" width="700" height="400" role="img" aria-label="Magnitude map of the continued zeta function, real part −3 to 3, imaginary part −30 to 30. Equivalent input selection is available through the sliders."></canvas></div><div id="complex-out" aria-live="polite"></div><p class="caption">Dark = small |ζ(s)|; light = large |ζ(s)|, on a compressed logarithmic scale (clipped at 100). This shows magnitude only, not phase. Dashed boundary a = 1 separates the original-series half-plane on the right from continuation on the left. The marked pole has no finite value. Coordinates are limited to this rectangle.</p>`)}
${optional('How a continuation can actually be constructed',`<p>Prerequisites: complex analysis for the proof. Subtract the slowly decaying tail using Euler–Maclaurin summation (DLMF §25.2). Even its first correction gives</p>${eq('\\zeta(s)=\\lim_{N\\to\\infty}\\left(\\sum_{n=1}^{N}n^{-s}-\\frac{N^{1-s}}{1-s}\\right),\\quad\\operatorname{Re}(s)>0,\\ s\\ne1.')}<p>For Re(s) > 1 the subtracted term tends to zero, so this agrees with the original definition. Further corrections extend the domain leftward. These are new, justified expressions, not ordinary sums of the original divergent terms.</p><p>For 0 < Re(s) ≤ 1, summation against an integral yields a leading term N¹⁻ˢ/(1 − s), plus a convergent correction and an error tending to zero. This leading term has no limit (at s = 1 it is replaced by ln N). For Re(s) ≤ 0 the terms themselves do not approach zero. This explains the full convergence boundary.</p>`)}
`,question:'Can we meaningfully study zeta outside the region where its original infinite series converges?',check:{q:'What does continuation preserve?',options:['The values of the original function wherever the original series converges.','Convergence of the original series at every new point.','Every arbitrary rule for assigning numbers to divergent sums.'],correct:0,why:'Continuation extends the analytic function consistently and uniquely. It does not change the convergence properties of the series that originally defined it.'}},
{id:'minus-twelfth',num:'7.5',title:'Why does −1/12 appear?',objective:'Derive ζ(−1) = −1/12 without treating a divergent series as an ordinary sum.',intro:'The famous expression “1 + 2 + 3 + 4 + … = −1/12” hides a change in mathematical construction. Making that change explicit resolves the apparent paradox.',body:`
<h2>First: what ordinary addition says</h2>${eq('S_N=1+2+\\cdots+N=\\frac{N(N+1)}2\\longrightarrow+\\infty.')}<p>Every partial sum is positive and the sums grow without bound. Thus the series <strong>diverges</strong>; it has no finite ordinary sum. Under the ordinary definition, the famous equality is false.</p>
<h2>Then: what the zeta function says</h2><p>Formally substituting s = −1 into ${m('\\sum n^{-s}')} produces ${m('\\sum n')}. But −1 lies outside Re(s) > 1. This is a <strong>formal resemblance</strong>, not a justified evaluation of that sum. The continued function does have the exact value</p>${eq('\\boxed{\\zeta(-1)=-\\frac1{12}}.')}
<div class="derivation-tabs" role="tablist" aria-label="Derivation view">
<button type="button" role="tab" id="tab-rigorous" aria-selected="true" aria-controls="derivation-rigorous" tabindex="0">Rigorous derivation</button>
<button type="button" role="tab" id="tab-formal" aria-selected="false" aria-controls="derivation-formal" tabindex="-1">Famous formal argument</button>
</div>
<section id="derivation-rigorous" class="derivation-panel" role="tabpanel" aria-labelledby="tab-rigorous" tabindex="0">
<h2>An accessible derivation</h2><p>We use a proved theorem, the <strong>zeta functional equation</strong>. It relates values at s and 1 − s. To read it, we need the sine function (from trigonometry) and the <strong>gamma function</strong> Γ. Gamma extends factorials: at positive integers, Γ(n) = (n − 1)!, where n! = 1 × 2 × … × n. In particular Γ(2) = 1. No evaluation of gamma at negative inputs is needed here.</p>
${eq('\\zeta(s)=2^s\\pi^{s-1}\\sin\\!\\left(\\frac{\\pi s}{2}\\right)\\Gamma(1-s)\\zeta(1-s).')}
<p>This identity is interpreted meromorphically, using limits at removable singularities. At s = −1 all factors are directly finite. We already know ζ(2) = π²/6, while sin(−π/2) = −1. Therefore</p>
${eq('\\begin{aligned}\\zeta(-1)&=2^{-1}\\pi^{-2}\\sin(-\\pi/2)\\Gamma(2)\\zeta(2)\\\\&=\\frac12\\cdot\\frac1{\\pi^2}\\cdot(-1)\\cdot1\\cdot\\frac{\\pi^2}{6}\\\\&=-\\frac1{12}.\\end{aligned}')}
<p>The functional equation is an advanced theorem we invoke, not prove, here. The substitution into <em>this</em> continued-function identity is justified. See <a href="https://dlmf.nist.gov/25.4.E2">DLMF 25.4.2</a>.</p>
</section>
<section id="derivation-formal" class="derivation-panel" role="tabpanel" aria-labelledby="tab-formal" tabindex="0" hidden>
<h2>Famous formal argument</h2>
<button type="button" id="formal-present" class="primary">Present formal argument</button>
${note('<strong>Formal manipulation of divergent series — not a proof using ordinary infinite sums.</strong>')}
<p>Follow the popular sketch one manipulation at a time. The equalities below are <em>formal suggestions</em>; each explanation identifies where ordinary infinite-sum reasoning needs justification.</p>
<div id="formal-steps">
<section class="formal-step" tabindex="-1" aria-labelledby="formal-heading-1">
<h3 id="formal-heading-1">1. Assign a value to A</h3>
${eq('A=1-1+1-1+\\cdots')}
${eq('A=1-(1-1+1-\\cdots)=1-A\\quad\\Longrightarrow\\quad A=\\frac12.')}
<details><summary>What is questionable here?</summary><p>A has partial sums 1, 0, 1, 0, … and does not converge ordinarily. Treating the shifted tail as a number and subtracting it assumes a summation rule that has not been justified.</p></details>
</section>
<section class="formal-step" tabindex="-1" aria-labelledby="formal-heading-2" hidden>
<h3 id="formal-heading-2">2. Add B to a shifted copy</h3>
<p>Shift the second row one position right, inserting a zero. Add the columns formally.</p>
${eq('\\begin{array}{r r r r r r r r}B={}&1&-2&+3&-4&+5&-6&+\\cdots\\\\B={}&0&+1&-2&+3&-4&+5&-\\cdots\\\\\\hline 2B={}&1&-1&+1&-1&+1&-1&+\\cdots\\end{array}')}
${eq('2B=A\\quad\\Longrightarrow\\quad B=\\frac14.')}
<details><summary>What is questionable here?</summary><p>B has partial sums 1, −1, 2, −2, … and does not converge ordinarily. Shifting its divergent rows and adding columns does not establish an ordinary sum. At a finite cutoff N the shifted row sums to B up to N − 1, not B up to N; the missing boundary term does not tend to zero.</p></details>
</section>
<section class="formal-step" tabindex="-1" aria-labelledby="formal-heading-3" hidden>
<h3 id="formal-heading-3">3. Subtract the alternating row from S</h3>
${eq('\\begin{array}{r r r r r r r r}S={}&1&+2&+3&+4&+5&+6&+\\cdots\\\\B={}&1&-2&+3&-4&+5&-6&+\\cdots\\\\\\hline S-B={}&0&+4&+0&+8&+0&+12&+\\cdots\\end{array}')}
<details><summary>What is questionable here?</summary><p>The subtraction works for each finite column, but neither S nor B is a finite ordinary sum. Writing their difference as the difference of two infinite-sum values assumes those values already exist.</p></details>
</section>
<section class="formal-step" tabindex="-1" aria-labelledby="formal-heading-4" hidden>
<h3 id="formal-heading-4">4. Remove zeros and factor</h3>
${eq('\\begin{aligned}S-B&=0+4+0+8+0+12+\\cdots\\\\&=4(1+2+3+\\cdots)\\\\&=4S.\\end{aligned}')}
<details><summary>What is questionable here?</summary><p>For finite N, the difference is 4 times the sum through ⌊N/2⌋, not 4 times the sum through N. Both grow without bound. Removing zeros and reindexing does not give a finite value that can be substituted into ordinary algebra.</p></details>
</section>
<section class="formal-step" tabindex="-1" aria-labelledby="formal-heading-5" hidden>
<h3 id="formal-heading-5">5. Solve the suggested equation</h3>
${eq('S-B=4S\\quad\\Longrightarrow\\quad -3S=B=\\frac14\\quad\\Longrightarrow\\quad\\boxed{S=-\\frac1{12}}.')}
<details><summary>What is questionable here?</summary><p>The last algebra would be valid for finite numbers satisfying the equation. The preceding manipulations did not establish such numbers or that equation. The usual rules for shifting, adding, subtracting, and regrouping convergent series cannot automatically be applied to these divergent expressions.</p></details>
</section>
</div>
<div class="formal-controls"><button type="button" id="formal-next" class="primary" aria-controls="formal-steps">Next manipulation</button><span id="formal-progress" class="formal-progress" role="status">Manipulation 1 of 5</span></div>
${optional('Why some intermediate values are meaningful',`<p><strong>Cesàro averaging:</strong> average the first N partial sums instead of taking the partial sums themselves. For A, these averages tend to 1/2, so A has <strong>Cesàro value 1/2</strong>.</p><p>Another procedure first damps the terms by powers of a real number r with 0 ≤ r &lt; 1, sums the resulting convergent power series, and then takes the limit as r approaches 1 from below. If this limit is finite, it is called the <strong>Abel sum</strong>. With this procedure:</p>${eq('A(r)=1-r+r^2-\\cdots=\\frac1{1+r},\\qquad 0\\le r<1,')}${eq('B(r)=1-2r+3r^2-\\cdots=\\frac1{(1+r)^2},\\qquad 0\\le r<1.')}<p>The first identity is a geometric series; differentiating r/(1 + r) gives the second. Taking r → 1 from below gives Abel values 1/2 for A and 1/4 for B.</p><p><strong>These intermediate assignments do not validate the entire formal argument.</strong> Applying the same damping to the positive-integer series gives</p>${eq('1+2r+3r^2+\\cdots=\\frac1{(1-r)^2}\\longrightarrow+\\infty\\quad(r\\to1^-).')}<p>Thus S has no finite Abel sum. At r &lt; 1 a one-position shift introduces a factor r; it cannot be silently discarded. Abel summation does not justify every step of the sketch.</p>`)}
<p>The sketch lands on the same number as the independently justified analytic-continuation value ${m('\\zeta(-1)=-1/12')}. It establishes neither an ordinary sum nor a proof of the Riemann Hypothesis. For S, the partial sums ${m('N(N+1)/2')} grow without bound.</p>
</section>
${viz('Two different mathematical constructions',`<div class="controls">${range('diverge-n','Last positive integer N',1,200,20)}</div><div class="split"><div><h3>Ordinary partial sums</h3>${chartHost('diverge-chart')}<p id="diverge-out" aria-live="polite"></p></div><div class="callout"><span class="label">Analytically continued function</span>${eq('\\zeta(-1)=-1/12')}<p>This is fixed. It is not a target approached by the partial sums on the left.</p><p class="caption">Separate panels intentionally compare different constructions, rather than suggesting a common limit.</p></div></div>`)}
<div class="table-wrap"><table><thead><tr><th>Construction</th><th>Meaning in this example</th></tr></thead><tbody><tr><td>Ordinary infinite sum</td><td>The finite limit of partial sums, if it exists.</td></tr><tr><td>Divergent series</td><td>Here Sₙ → +∞; there is no finite ordinary sum.</td></tr><tr><td>Analytic continuation</td><td>The unique extension of the analytic zeta function; it gives ζ(−1) = −1/12.</td></tr><tr><td>Zeta-function regularization</td><td>Assigning the continued value ζ(−1) to the formally associated divergent expression, with the procedure explicitly named.</td></tr></tbody></table></div>
${note('<strong>Precise language:</strong> “The zeta-regularized value of 1 + 2 + 3 + … is −1/12.” This does not license ordinary algebra with divergent series. Regularization is an additional procedure with its own conditions, not a new ordinary sum.')}
${optional('What is assumed in the derivation?',`<p>Prerequisites for a proof of the functional equation: complex analysis and, in one approach, Fourier analysis/Poisson summation. The equation reflects a deeper symmetry between s and 1 − s. For this evaluation, only its stated theorem, Euler’s value ζ(2), and elementary arithmetic are required. The value at −1 illustrates continuation; it supplies neither a premise nor a proof of the Riemann Hypothesis.</p>`)}
`,question:'How can ζ(−1) equal −1/12 while the corresponding ordinary series diverges?',check:{q:'Which mathematical construction justifies each assigned value?',options:['Ordinary infinite sums give A = 1/2, B = 1/4, and S = −1/12.','Abel summation gives finite values to all three series.','Cesàro averaging gives A = 1/2; Abel summation gives A = 1/2 and B = 1/4; analytic continuation gives ζ(−1) = −1/12.'],correct:2,why:'All three ordinary series diverge. A has a Cesàro value, A and B have finite Abel values, and S has no finite Abel sum. Analytic continuation independently justifies ζ(−1), which can be assigned to S through explicitly named zeta regularization. The formal sketch itself justifies none of these constructions.'}},
{id:'zeros',num:'8',title:'Where does zeta vanish?',objective:'Locate trivial zeros, the critical strip, and the critical line.',intro:'A zero of a function is an input whose output is exactly zero. For a complex function, both output coordinates must vanish.',body:`
<p>For f(x) = x² − 4, the real zeros are ±2. The polynomial s² + 1 has complex zeros ±i, since i² = −1. For zeta, we ask which inputs satisfy ${m('\\zeta(s)=0')}.</p>
<h2>Two kinds of zeros</h2><p>The <strong>trivial zeros</strong> are exactly −2, −4, −6, … on the negative real axis. “Trivial” describes their direct explanation by the functional equation, not their value as mathematics. All the other zeros are called <strong>nontrivial</strong>.</p><p>It is proved that every nontrivial zero lies in the <strong>critical strip</strong> ${m('0<\\operatorname{Re}(s)<1')}. The <strong>critical line</strong> ${m('\\operatorname{Re}(s)=1/2')} runs through its center. Being in the strip is a theorem; being on its middle line for <em>every</em> nontrivial zero is the conjecture.</p>
<h2>Why this strip?</h2><p>The convergent Euler product excludes zeros for Re(s) > 1. A deeper proved theorem excludes zeros on Re(s) = 1; this zero-free boundary was central to the 1896 proofs of the PNT. The functional equation then excludes zeros for Re(s) ≤ 0 except the negative even integers. This uses the boundary theorem and, at s = 0, the value ζ(0) = −1/2; symmetry alone would not exclude the boundary. See <a href="https://dlmf.nist.gov/25.10">DLMF §25.10</a>.</p>
${ex('A complex zero',`<p>The first zero above the real axis has s ≈ 0.5 + 14.134725i. Its real coordinate is 0.5 and its imaginary coordinate is about 14.134725. These displayed coordinates are rounded; inserting the rounded point need not give an exact zero.</p>`)}
${viz('Inspect the zeros',`<div class="controls"><label class="control" for="zero-select">Known zero above the axis<select id="zero-select"></select></label></div>${chartHost('zeros-chart')}<p id="zeros-out" aria-live="polite"></p><h3>Trivial zeros: a separate real-axis view</h3>${chartHost('trivial-chart')}<p class="caption">Shaded region: critical strip. Teal vertical line: Re(s) = 1/2. The nontrivial plot shows the first eight positive-height zeros and their conjugates. Coordinates are rounded from verified numerical data, not inferred from a heatmap. The real-axis plot shows six of infinitely many trivial zeros.</p>`)}
${optional('Symmetries do not prove alignment',`<p>Prerequisites: complex conjugation. Because ζ has a real defining series, continuation gives ${m('\\zeta(\\overline{s})=\\overline{\\zeta(s)}')}. Thus a zero β + iγ brings its conjugate β − iγ. The functional equation also gives 1 − β + iγ. An off-line quartet would respect both symmetries. Symmetry permits the critical line, but does not force all zeros onto it.</p>`)}
`,question:'Can every nontrivial zero be confined to the middle of the critical strip?',check:{q:'Which statement is already proved?',options:['All nontrivial zeros lie in 0 < Re(s) < 1.','All zeros, including trivial ones, have real part 1/2.','All nontrivial zeros are known to lie on the critical line.'],correct:0,why:'The strip containment is unconditional. Universal alignment on the critical line is precisely what RH asks about.'}},
{id:'rh',num:'9',title:'The Riemann Hypothesis',objective:'State RH precisely and distinguish finite evidence from universal proof.',intro:'The conjecture is a statement about a whole infinite set of zeros, not just those we can draw.',body:`
${note('<strong>Unproved conjecture.</strong> This course treats the Riemann Hypothesis as an open problem, as listed by the <a href="https://www.claymath.org/millennium/Riemann-Hypothesis/">Clay Mathematics Institute</a>. Numerical evidence is not a proof.')}
<p><strong>Every nontrivial zero of ζ(s) has real part 1/2.</strong> Equivalently,</p>${eq('\\zeta(s)=0\\quad\\text{and}\\quad0<\\operatorname{Re}(s)<1\\quad\\Longrightarrow\\quad\\operatorname{Re}(s)=\\frac12.')}
<p>Geometrically, all nontrivial zeros would stand on a single vertical line. The imaginary coordinates vary; RH does not predict equal spacing. It says nothing new about the already understood negative even zeros.</p>
<h2>What Riemann proposed</h2><p>In his 1859 paper, Bernhard Riemann connected prime counting with the complex zeros of zeta and suggested the alignment now called RH. Many zeros have been rigorously verified on the line, and infinitely many are known to lie there. Neither result shows that <em>none</em> lie elsewhere.</p><p>A proof must cover all possible nontrivial zeros, however high their imaginary parts. One verified off-line zero would refute RH. No accepted general proof or counterexample is supplied here; the missing step is a universal argument excluding every off-line zero.</p>
${viz('Evidence, zoom, and a hypothetical counterexample',`<div class="controls">${range('rh-height','Visible positive height',16,50,50,1)}<label class="control" for="rh-zero">Inspect computed zero<select id="rh-zero"></select></label><label class="control"><span>Thought experiment</span><span><input type="checkbox" id="counterexample"> Show a hypothetical off-line quartet</span></label></div>${chartHost('rh-chart')}<p id="rh-out" aria-live="polite"></p><p class="caption">Use height to zoom vertically; selecting a zero expands the view if necessary. Teal circles: actual tabulated zeros (rounded). Orange crosses: invented locations for a thought experiment, explicitly <strong>not</strong> computed zeros of ζ. The upper-half view shows two members of a hypothetical quartet; their conjugates would lie below the axis.</p>`)}
${ex('A finite test cannot exhaust infinity','<p>Verifying the first eight displayed zeros checks eight cases. Even a trillion checked cases cannot rule out an off-line zero at a greater height. A universal theorem needs reasoning that also covers every unchecked case.</p>')}
`,question:'Can we prove that every nontrivial zero lies exactly on the critical line?',check:{q:'What would disprove RH?',options:['A negative even zero.','One rigorously verified nontrivial zero with real part different from 1/2.','A small nonzero numerical residual at a rounded zero.'],correct:1,why:'One actual off-line zero refutes the universal claim. Trivial zeros are excluded from RH, and rounding error is not a counterexample.'}},
{id:'errors',num:'10',title:'Back to primes: how large can the error be?',objective:'Explain the RH-equivalent prime-counting error bound and the role of zeros.',intro:'The smooth trend counts roughly how many primes to expect. Zeta’s zeros govern how the exact count fluctuates around that trend.',body:`
<p>The PNT says ${m('\\pi(x)\\sim x/\\ln x')}. A finer question asks about the signed error ${m('E(x)=\\pi(x)-\\operatorname{Li}_2(x)')}. The zeros enter explicit formulas for prime-related counting functions; their real coordinates control the size of oscillating contributions.</p>
<h2>The square-root scale</h2><p>The following asymptotic statement is <strong>equivalent to RH</strong>:</p>${eq('\\pi(x)=\\operatorname{Li}_2(x)+O(\\sqrt{x}\\ln x)\\qquad(x\\to\\infty).')}
<p><strong>Big O</strong> means there exist constants C > 0 and x₀ such that for <em>every</em> x ≥ x₀,</p>${eq('|\\pi(x)-\\operatorname{Li}_2(x)|\\le C\\sqrt{x}\\ln x.')}
<p>The constants do not depend on x. This is an eventual upper bound, not an exact error, not a probability interval, and not an assertion with C = 1 at every x. Changing the logarithmic-integral convention adds only a constant and leaves the equivalence unchanged.</p>
${ex('Reading an error bound',`<p>At x = 10,000, the scale √x ln(x) is about 921.034. If a bound with C = 0.1 applied there, the allowed error would be about 92.103. Big O alone neither specifies that C nor tells us that this x is past x₀.</p>`)}
<p>Compared with x/ln(x), this error scale is relatively small: ${m('(\\sqrt{x}\\ln x)/(x/\\ln x)=\\ln^2(x)/\\sqrt{x}\\to0')}. Yet even a strong counting bound does not give the exact locations of individual primes. The PNT is unconditional; the stated universal square-root error control is conditional on RH.</p>
${viz('Measure the error and compare its scale',`<div class="controls">${range('error-x','Maximum x',100,10000,2000,100)}${range('error-c','Illustrative multiplier C',.05,1,.1,.05)}</div>${chartHost('error-chart')}<div id="error-out" aria-live="polite"></div><p class="caption">Teal: actual π(x) − Li₂(x) from exact counts and numerical integration. Blue dashed: ±C√x ln(x), an <strong>illustrative envelope</strong>. Its adjustable C is not certified by RH or by this finite experiment. All visible counts are unconditional; extrapolating this error scale to all sufficiently large x is the RH-equivalent assertion.</p>`)}
${optional('How a zero becomes a fluctuation',`<p>Prerequisites: logarithms, trigonometry, complex exponentials; the full proof requires analytic number theory. It is cleaner to use the weighted prime-power count</p>${eq('\\psi(x)=\\sum_{p^k\\le x}\\ln p.')}<p>For x > 1 away from prime powers, one form of the explicit formula is</p>${eq('\\psi(x)=x-\\sum_\\rho\\frac{x^\\rho}{\\rho}-\\ln(2\\pi)-\\frac12\\ln(1-x^{-2}).')}<p>The sum runs over nontrivial zeros with multiplicity and is interpreted as a symmetric height limit, not an absolutely convergent free rearrangement. At a prime power the formula gives the average of the two one-sided values. This is a formula for ψ, <em>not</em> for π; recovering π requires additional transformations and prime-power corrections.</p><p>For ρ = β + iγ,</p>${eq('x^\\rho=x^\\beta[\\cos(\\gamma\\ln x)+i\\sin(\\gamma\\ln x)].')}<p>A conjugate pair contributes a real oscillation, with scale governed by xᵝ and a coefficient involving ρ. RH sets β = 1/2 for every pair. Controlling the infinite collection rigorously leads to error estimates, including the π-bound above. A few isolated waves cannot establish it. See <a href="https://dlmf.nist.gov/25.16">DLMF §25.16</a> and the <a href="https://www.claymath.org/wp-content/uploads/2022/05/riemann.pdf">Bombieri problem description</a>.</p>`)}
`,question:'Why would locating zeros of a complex function tell us something fundamental about primes?',check:{q:'What does E(x) = O(√x ln x) mean?',options:['E(x) equals √x ln x.','There are fixed C and x₀ with |E(x)| ≤ C√x ln x for every x ≥ x₀.','Every integer within √x of x is prime.'],correct:1,why:'Big O is a uniform eventual bound with constants independent of x. It gives neither equality nor exact prime locations.'}},
{id:'overview',num:'Finish',title:'One connected mathematical story',objective:'Connect the complete chain and identify what is known versus conjectural.',intro:'We began with divisibility. We arrived at a claim about complex zeros because unique factorization lets zeta translate between these two worlds.',body:`
<ol class="concept-map" id="concept-map"></ol>
<p class="math-note">Read the map left to right, row by row. Each concept opens its lesson. The −1/12 stop is an illustration of continuation, not a logical prerequisite for RH.</p>
<h2>What is proved</h2><p>Prime factorization is unique. The PNT describes the asymptotic density of primes. Euler’s product connects primes to zeta. Zeta has a unique meromorphic continuation with its only pole at 1; ζ(−1) = −1/12. All nontrivial zeros lie in the critical strip; infinitely many lie on the critical line. The displayed low zeros have been computed and verified.</p>
<h2>What remains unproved</h2><p>RH says <strong>every</strong> nontrivial zero lies on Re(s) = 1/2. Finite computations do not settle that claim. Proving it would establish the equivalent square-root-scale prime-counting error bound, revealing sharp control over prime-distribution fluctuations. It would not turn prime counts into a list of exact prime positions.</p>
${note('<strong>Keep the constructions separate:</strong> the ordinary series 1 + 2 + 3 + … diverges. The continued function value ζ(−1) = −1/12 is exact. Neither statement proves RH.')}
<h2>References and further study</h2>
<ul><li><a href="https://www.claymath.org/millennium/Riemann-Hypothesis/">Clay Mathematics Institute: Riemann Hypothesis</a> — problem statement and open-problem status (checked 21 November 2026).</li><li><a href="https://www.claymath.org/wp-content/uploads/2022/05/riemann.pdf">E. Bombieri, Problems of the Millennium: The Riemann Hypothesis</a> — authoritative technical overview, explicit formulas and error bounds.</li><li><a href="https://dlmf.nist.gov/25.2">NIST DLMF §25.2</a>, <a href="https://dlmf.nist.gov/25.4">§25.4</a>, <a href="https://dlmf.nist.gov/25.6">§25.6</a>, <a href="https://dlmf.nist.gov/25.10">§25.10</a>, <a href="https://dlmf.nist.gov/25.16">§25.16</a> — definitions, continuation, functional equation, special values, zeros and prime applications.</li><li><a href="https://www.lmfdb.org/zeros/zeta/">LMFDB: zeros of ζ(s)</a> — verified numerical zero data. This page stores only the first eight positive heights, rounded to 12 decimal places (coordinate rounding at most 5 × 10⁻¹³).</li><li>T. M. Apostol, <em>Introduction to Analytic Number Theory</em>, Springer, 1976, Chapters 4 and 12 — an introductory textbook treatment.</li><li>E. C. Titchmarsh, revised by D. R. Heath-Brown, <em>The Theory of the Riemann Zeta-function</em>, 2nd ed., Oxford University Press, 1986 — advanced treatment.</li></ul>
${optional('Numerical methods and limits of the browser experiments',`<p>Prime counts use an exact sieve through 10,000. Li₂ values use composite Simpson integration with step 0.05; intermediate plotted inputs are integers. Estimates are displayed to 3 decimals.</p><p>Zeta evaluations use an Euler–Maclaurin tail with N = 64 and eight Bernoulli correction terms. The complex map is restricted to −3 ≤ Re(s) ≤ 3 and |Im(s)| ≤ 30; inputs within distance 0.04 of the pole are masked. Readouts show 5 decimal places on this rectangle. Comparisons against high-precision reference values test absolute error below 10⁻⁶; this is a tested accuracy target, not interval-certified arithmetic. Map pixels are coarser than the readout and cannot certify zeros.</p><p>The real zeta plot is restricted to 1.05 ≤ s ≤ 5, with 6 displayed decimals. A reference ζ value uses the corrected expression; the N-term curves always remain ordinary finite partial sums. Stored zeros are supplied separately from this approximate evaluator. All graphs label their variables and use native SVG or canvas, without an external graph service.</p><p>KaTeX and its fonts are included locally under assets/vendor/katex (MIT license). The lesson needs no network connection; reference links naturally require one. Session progress is intentionally not stored.</p>`)}
`,question:'Can you explain the route from prime factorization to an error bound, and where the unproved step lies?',check:{q:'Which statement captures the central claim and its status?',options:['Analytic continuation proves RH because ζ(−1) is negative.','RH is proved by the first few zero coordinates.','RH conjectures that all nontrivial zeros have real part 1/2; this would sharply constrain prime-counting error.'],correct:2,why:'The bridge is the Euler product and the explicit formulas. The universal location of the nontrivial zeros is the unproved part; −1/12 is a separate example of continuation.'}}
];

// Exact finite arithmetic for primes, and numerical quadrature for Li_2.
const MAX=10000, composite=new Uint8Array(MAX+1), primes=[], counts=new Uint16Array(MAX+1);
composite[0]=composite[1]=1;
for(let p=2;p*p<=MAX;p++)if(!composite[p])for(let n=p*p;n<=MAX;n+=p)composite[n]=1;
for(let n=2;n<=MAX;n++){if(!composite[n])primes.push(n);counts[n]=counts[n-1]+(!composite[n]?1:0);}
const liValues=new Float64Array(MAX+1);
for(let n=3;n<=MAX;n++){let total=0,h=.05;for(let j=0;j<20;j++){const a=n-1+j*h;total+=h/6*(1/Math.log(a)+4/Math.log(a+h/2)+1/Math.log(a+h));}liValues[n]=liValues[n-1]+total;}
const li=x=>liValues[Math.round(x)];
const C=(r=0,i=0)=>({r,i}), add=(a,b)=>C(a.r+b.r,a.i+b.i), mul=(a,b)=>C(a.r*b.r-a.i*b.i,a.r*b.i+a.i*b.r), scale=(a,t)=>C(a.r*t,a.i*t), div=(a,b)=>scale(mul(a,C(b.r,-b.i)),1/(b.r*b.r+b.i*b.i));
const mag=a=>Math.hypot(a.r,a.i);
const npow=(n,s)=>{const l=Math.log(n),v=Math.exp(-s.r*l);return C(v*Math.cos(s.i*l),-v*Math.sin(s.i*l));};
const bernoulli=[1/12,-1/720,1/30240,-1/1209600,1/47900160,-691/1307674368000,7/523069747200,-3617/10670622842880000];
function zeta(a,b=0,N=64){
 const s=C(a,b);if(a===1&&b===0)return C(Infinity,NaN);
 let sum=C();for(let n=1;n<N;n++)sum=add(sum,npow(n,s));
 const pow=npow(N,s);sum=add(sum,add(div(scale(pow,N),C(a-1,b)),scale(pow,.5)));
 let rising=C(1),order=0;
 bernoulli.forEach((c,k)=>{const target=2*k+1;while(order<target){rising=mul(rising,C(a+order,b));order++;}sum=add(sum,scale(mul(rising,pow),c*Math.pow(N,-target)));});
 return sum;
}
function partial(s,N){let v=0;for(let n=1;n<=N;n++)v+=n**(-s);return v;}
// Rounded positive ordinates of the first eight zeta zeros (LMFDB).
const zeroHeights=[14.134725141735,21.022039638772,25.010857580146,30.424876125860,32.935061587739,37.586178158826,40.918719012147,43.327073280915];
const colors={teal:'#08796b',blue:'#245ac7',amber:'#a85513',grid:'#e1e8ec'};
function points(x0,x1,n,fn){return Array.from({length:n+1},(_,i)=>{const x=x0+(x1-x0)*i/n;return[x,fn(x)];});}
function plot(host,{x0=0,x1=100,y0=0,y1=100,xlabel='x',ylabel='y',series=[],marks=[],bands=[],guides=[],title='Interactive graph'}){
 const W=Math.max(290,Math.min(740,$(host).clientWidth)),H=330,L=59,R=20,T=30,B=49,w=W-L-R,h=H-T-B;
 const X=x=>L+(x-x0)/(x1-x0)*w,Y=y=>T+h-(y-y0)/(y1-y0)*h;
 const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title><defs><clipPath id="clip-${host}"><rect x="${L}" y="${T}" width="${w}" height="${h}"/></clipPath></defs>`;
 bands.forEach(b=>{svg+=`<rect x="${X(b.x0)}" y="${T}" width="${X(b.x1)-X(b.x0)}" height="${h}" fill="${b.color||'#eaf4f0'}"/>`;});
 for(let i=0;i<=4;i++){const y=y0+(y1-y0)*i/4;svg+=`<line x1="${L}" y1="${Y(y)}" x2="${W-R}" y2="${Y(y)}" stroke="${colors.grid}"/><text x="${L-9}" y="${Y(y)+4}" text-anchor="end">${esc(fmt(y,Math.abs(y1-y0)<5?2:1))}</text>`;}
 const tickCount=W<450?3:5;
 for(let i=0;i<=tickCount;i++){const x=x0+(x1-x0)*i/tickCount;svg+=`<text x="${X(x)}" y="${H-B+23}" text-anchor="middle">${esc(fmt(x,Math.abs(x1-x0)<5?2:0))}</text>`;}
 svg+=`<path d="M${L} ${T}V${H-B}H${W-R}" fill="none" stroke="#879ca8"/><text class="axis-label" x="${W-R}" y="${H-3}" text-anchor="end">${esc(xlabel)}</text><text class="axis-label" x="${L}" y="17">${esc(ylabel)}</text><g clip-path="url(#clip-${host})">`;
 guides.forEach(g=>{svg+=g.x!==undefined?`<line x1="${X(g.x)}" x2="${X(g.x)}" y1="${T}" y2="${H-B}" stroke="${g.color||colors.teal}" stroke-dasharray="${g.dash||'5 4'}"/>`:`<line x1="${L}" x2="${W-R}" y1="${Y(g.y)}" y2="${Y(g.y)}" stroke="#7f939f"/>`;});
 series.forEach(s=>{let d='';s.data.forEach(([x,y],i)=>{if(Number.isFinite(y))d+=`${i?'L':'M'}${X(x).toFixed(2)},${Y(y).toFixed(2)} `;});svg+=`<path class="chart-line" d="${d}" stroke="${s.color||colors.teal}" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;});
 marks.forEach(p=>{const x=X(p.x),y=Y(p.y);if(p.cross){svg+=`<path d="M${x-6} ${y-6}l12 12m0 -12l-12 12" stroke="${colors.amber}" stroke-width="3"><title>${esc(p.label)}</title></path>`;}else{svg+=`<circle class="${p.onSelect?'zero':''}" cx="${x}" cy="${y}" r="${p.selected?6:4}" fill="${p.color||colors.teal}" ${p.onSelect?`tabindex="0" role="button" aria-label="${esc(p.label)}" data-zero="${p.onSelect}"`:''}><title>${esc(p.label||'')}</title></circle>`;}});
 svg+='</g></svg>';$(host).innerHTML=svg;
}
const numberVal=id=>+$(id).value;
let activeDraw=null, resizeTimer;
function bindRanges(ids,fn){activeDraw=fn;ids.forEach(id=>$(id).addEventListener('input',()=>{const out=$(id+'-value');if(out)out.textContent=fmt(numberVal(id),2);fn();}));fn();}
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(lessons[current].id==='continuation')complexBase();if(activeDraw)activeDraw();},120);});
function renderMath(root=$('lesson')){
 root.querySelectorAll('[data-math]').forEach(el=>{const tex=el.dataset.math;if(window.katex){try{katex.render(tex,el,{displayMode:el.classList.contains('equation'),throwOnError:true,output:'htmlAndMathml',strict:'error'});}catch(err){el.textContent=tex;el.classList.add('math-error');console.error('Math rendering failed',tex,err);}}else{el.textContent=tex;}});
}

let mapBase=null, mapGeometry=null;
function complexBase(){
 const canvas=$('complex-map'),ctx=canvas.getContext('2d'),W=Math.max(290,Math.min(700,canvas.parentElement.clientWidth)),H=400,L=44,T=25,w=W-59,h=330;
 canvas.width=W;canvas.height=H;mapGeometry={W,H,L,T,w,h};
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){const a=-3+(x+2)/w*6,b=30-(y+2)/h*60;const v=mag(zeta(a,b));const t=Math.max(0,Math.min(1,(Math.log10(Math.max(1e-6,v))+3)/5));const hue=181+28*t,light=10+85*t;ctx.fillStyle=`hsl(${hue} 45% ${light}%)`;ctx.fillRect(L+x,T+y,4,4);}
 ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([6,4]);const boundary=L+4/6*w;ctx.beginPath();ctx.moveTo(boundary,T);ctx.lineTo(boundary,T+h);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#182f3c';ctx.font='14px system-ui';ctx.textAlign='center';[-3,-2,-1,0,1,2,3].forEach(a=>ctx.fillText(a,L+(a+3)/6*w,T+h+23));ctx.textAlign='right';[-30,-15,0,15,30].forEach(b=>ctx.fillText(b,L-8,T+(30-b)/60*h+5));ctx.textAlign='left';ctx.fillText('Im(s)',7,15);ctx.fillText('Re(s)',W-45,H-8);ctx.fillStyle='#102c38';ctx.fillRect(L+4,T+4,108,24);ctx.fillRect(boundary+3,T+4,W<450?49:107,24);ctx.fillStyle='#fff';ctx.fillText(W<450?'series':'series domain',boundary+6,T+20);ctx.fillText('continuation',L+10,T+20);
 const px=L+4/6*w,py=T+h/2;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,5,0,2*Math.PI);ctx.fill();ctx.fillText('pole',px+9,py+5);
 mapBase=ctx.getImageData(0,0,W,H);
}
// Stable token identities and explicit merge sources drive FLIP animations between
// real, responsive DOM positions. Every state is complete, including when motion
// is reduced or a transition is interrupted. No timer advances the argument.
function openFormalPresentation(launch){

 if(id==='pnt')bindRanges(['pnt-x'],()=>{const x=numberVal('pnt-x'),actual=counts[x],p=x/Math.log(x),l=li(x);plot('pnt-chart',{x0:2,x1:x,y1:Math.max(l,actual)*1.1,ylabel:'Count / estimate',series:[{data:points(2,x,Math.min(x-2,600),t=>counts[Math.floor(t)])},{data:points(2,x,300,t=>t/Math.log(t)),color:colors.blue,dash:'7 4'},{data:points(2,x,300,t=>li(t)),color:colors.amber,dash:'2 4'}],title:`π(x), x/ln(x), and Li₂(x), through ${x}`});$('pnt-table').innerHTML=`<table><caption>Comparison at x = ${x}</caption><thead><tr><th>Method</th><th>Value</th><th>Absolute error</th><th>Relative error</th></tr></thead><tbody>${[['π(x) · teal solid',actual],['x/ln(x) · blue dashed',p],['Li₂(x) · amber dotted',l]].map(([name,v])=>`<tr><td>${name}</td><td>${fmt(v)}</td><td>${fmt(Math.abs(v-actual))}</td><td>${fmt(100*Math.abs(v-actual)/actual,2)}%</td></tr>`).join('')}</tbody></table>`;});
 if(id==='series')bindRanges(['series-s','series-n'],()=>{const s=numberVal('series-s'),N=numberVal('series-n');function sums(exp){let v=0;return Array.from({length:N},(_,i)=>[i+1,v+=(i+1)**(-exp)]);}const ds=sums(s),dh=sums(1),dq=sums(2);plot('series-chart',{x0:1,x1:N,y1:Math.max(ds.at(-1)[1],dh.at(-1)[1])*1.06,xlabel:'Number of terms N',ylabel:'Partial sum Sₙ',series:[{data:dh,color:colors.blue,dash:'7 4'},{data:dq,color:colors.amber,dash:'2 4'},{data:ds}],title:`Partial sums for s = ${s}, harmonic series, and reciprocal squares`});$('series-out').innerHTML=`<p><strong>S<sub>${N}</sub>(${fmt(s,2)}) = ${fmt(ds.at(-1)[1],6)}</strong>. ${s>1?'Convergent (s > 1); a finite sum is still below its limit.':'Divergent (s ≤ 1); no finite ordinary sum exists.'}</p>`;});
 if(id==='zeta')bindRanges(['zeta-s','zeta-n'],()=>{const s=numberVal('zeta-s'),N=numberVal('zeta-n'),v=zeta(s).r,p=partial(s,N);plot('zeta-chart',{x0:1.05,x1:5,y1:22,xlabel:'Real input s',ylabel:'ζ(s) / partial sum',series:[{data:points(1.05,5,250,t=>zeta(t).r)},{data:points(1.05,5,180,t=>partial(t,N)),color:colors.blue,dash:'7 4'}],guides:[{x:s}],marks:[{x:s,y:v,label:`ζ(${s}) ≈ ${fmt(v,6)}`}],title:`Zeta and its ${N}-term partial sum, for real s > 1`});$('zeta-out').innerHTML=`<span>ζ(${fmt(s,2)}) ≈ <strong>${fmt(v,6)}</strong></span><span>S<sub>${N}</sub> ≈ ${fmt(p,6)}</span><span>Missing tail ≈ ${fmt(v-p,6)}</span>`;});
 if(id==='euler')bindRanges(['euler-k','euler-s'],()=>{const k=numberVal('euler-k'),s=numberVal('euler-s'),ps=primes.slice(0,k),prod=ps.reduce((a,p)=>a/(1-p**(-s)),1),v=zeta(s).r;$('euler-factors').innerHTML=eq(ps.map(p=>`(1-${p}^{-${fmt(s,1)}})^{-1}`).join('\\,')+'\\quad\\text{(finite product)}');renderMath($('euler-factors'));$('euler-expansion').innerHTML='<table><thead><tr><th>Prime</th><th>Denominators from its powers</th></tr></thead><tbody>'+ps.map(p=>`<tr><td>${p}</td><td>1, ${p}, ${p*p}, ${p*p*p}, …</td></tr>`).join('')+'</tbody></table><p class=caption>Each row represents 1 + p⁻ˢ + p⁻²ˢ + p⁻³ˢ + …. Multiplying factors means choosing one power from each row and multiplying the resulting denominators.</p>';$('euler-out').innerHTML=`<span>Product ≈ <strong>${fmt(prod,6)}</strong></span><span>ζ(${fmt(s,1)}) ≈ ${fmt(v,6)}</span><span>Difference ≈ ${fmt(v-prod,6)}</span>`;const generated=[];for(let n=1;n<=100;n++){let t=n;ps.forEach(p=>{while(t%p===0)t/=p;});if(t===1)generated.push(n);}$('euler-generated').innerHTML=generated.map(n=>`<span>${n}</span>`).join('');});
 if(id==='continuation'){
  complexBase();const update=()=>{const a=numberVal('complex-a'),b=numberVal('complex-b'),ctx=$('complex-map').getContext('2d');ctx.putImageData(mapBase,0,0);const {L,T,w,h}=mapGeometry,x=L+(a+3)/6*w,y=T+(30-b)/60*h;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,6,0,2*Math.PI);ctx.stroke();ctx.strokeStyle='#172e3b';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,8,0,2*Math.PI);ctx.stroke();const near=Math.hypot(a-1,b)<.04,z=zeta(a,b);$('complex-out').innerHTML=`<p>Input <strong>s = ${fmt(a,2)} ${b<0?'−':'+'} ${fmt(Math.abs(b),2)}i</strong><br>${near?'Pole neighborhood masked: ζ(1) has no finite value.':`ζ(s) ≈ <span class="numerical">${z.r.toFixed(5)} ${z.i<0?'−':'+'} ${Math.abs(z.i).toFixed(5)}i</span>; |ζ(s)| ≈ ${fmt(mag(z),5)}.`}<br><strong>${a>1?'Original series converges absolutely here.':'Use analytic continuation here; the original series does not converge.'}</strong></p>`;};bindRanges(['complex-a','complex-b'],update);
  $('complex-map').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect(),{W,H,L,T,w,h}=mapGeometry,px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;const a=Math.max(-3,Math.min(3,(px-L)/w*6-3)),b=Math.max(-30,Math.min(30,30-(py-T)/h*60));$('complex-a').value=(Math.round(a*20)/20).toFixed(2);$('complex-b').value=(Math.round(b*20)/20).toFixed(2);['complex-a','complex-b'].forEach(id=>$(id+'-value').textContent=fmt(numberVal(id),2));update();});
 }
 if(id==='minus-twelfth')initDerivationViews();
 if(id==='minus-twelfth')bindRanges(['diverge-n'],()=>{const N=numberVal('diverge-n'),sum=N*(N+1)/2;plot('diverge-chart',{x0:0,x1:N,y1:Math.max(1,sum*1.1),xlabel:'N',ylabel:'1 + 2 + … + N',series:[{data:points(0,N,N,n=>n*(n+1)/2)}],title:`Positive-integer partial sums through ${N}; S_N = ${sum}`});$('diverge-out').innerHTML=`S<sub>${N}</sub> = <strong>${fmt(sum,0)}</strong>. Increasing N increases this positive sum.`;});
 if(id==='zeros'){
  zeroOptions('zero-select');const draw=()=>{const sel=numberVal('zero-select'),marks=zeroHeights.flatMap((h,i)=>[1,-1].map(sign=>({x:.5,y:sign*h,selected:i===sel,label:`Zero ${i+1}: 0.5 ${sign>0?'+':'−'} ${h.toFixed(12)}i`,onSelect:String(i+1)})));plot('zeros-chart',{x0:-.25,x1:1.25,y0:-48,y1:48,xlabel:'Re(s)',ylabel:'Im(s)',bands:[{x0:0,x1:1}],guides:[{x:0},{x:1},{x:.5,dash:'0'},{y:0}],marks,title:'Known nontrivial zeros and conjugates in the critical strip'});$('zeros-out').textContent=`Selected zero #${sel+1}: Re(s) = 0.5, Im(s) ≈ ±${zeroHeights[sel].toFixed(12)}. Rounded data, not an exact decimal zero.`;bindZeroMarks('zeros-chart','zero-select',draw);};activeDraw=draw;$('zero-select').addEventListener('change',draw);draw();plot('trivial-chart',{x0:-13,x1:1,y0:-1,y1:1,xlabel:'Re(s)',ylabel:'Im(s) = 0 on the axis',guides:[{y:0}],marks:[-2,-4,-6,-8,-10,-12].map(x=>({x,y:0,label:`Trivial zero ${x}`})),title:'Trivial zeros −2, −4, −6, −8, −10, −12 on the real axis'});
 }
 if(id==='rh'){
  zeroOptions('rh-zero');const draw=()=>{const height=numberVal('rh-height'),sel=numberVal('rh-zero'),hyp=$('counterexample').checked;const marks=zeroHeights.map((h,i)=>({x:.5,y:h,selected:i===sel,label:`Computed zero #${i+1}: 0.5 + ${h.toFixed(12)}i`,onSelect:String(i+1)}));if(hyp)marks.push({x:.25,y:12,cross:true,label:'Hypothetical location only, not a zeta zero'},{x:.75,y:12,cross:true,label:'Hypothetical reflected location only, not a zeta zero'});plot('rh-chart',{x0:0,x1:1,y1:height,xlabel:'Re(s)',ylabel:'Positive Im(s)',bands:[{x0:0,x1:1}],guides:[{x:.5,dash:'0'}],marks,title:`Critical line and tabulated zeros up to height ${height}${hyp?'; hypothetical off-line crosses are not actual zeros':''}`});$('rh-out').textContent=`Selected computed zero #${sel+1}: s ≈ 0.5 + ${zeroHeights[sel].toFixed(12)}i.${zeroHeights[sel]>height?' Selected zero is above this zoom; choose it again to reveal it.':''}${hyp?' Orange crosses are hypothetical and are not evidence against RH.':''}`;bindZeroMarks('rh-chart','rh-zero',draw);};bindRanges(['rh-height'],draw);$('counterexample').addEventListener('change',draw);$('rh-zero').addEventListener('change',()=>{const h=zeroHeights[numberVal('rh-zero')];if(h>numberVal('rh-height')){$('rh-height').value=Math.ceil(h+2);$('rh-height-value').textContent=$('rh-height').value;}draw();});
 }
 if(id==='errors')bindRanges(['error-x','error-c'],()=>{const x=numberVal('error-x'),c=numberVal('error-c'),bound=t=>c*Math.sqrt(t)*Math.log(t),lim=bound(x)*1.12,data=points(2,x,Math.min(x-2,900),t=>{const n=Math.round(t);return[n,counts[n]-li(n)];}).map(pair=>pair[1]);plot('error-chart',{x0:2,x1:x,y0:-lim,y1:lim,xlabel:'x',ylabel:'Signed error / illustrative envelope',series:[{data:points(2,x,300,bound),color:colors.blue,dash:'6 4'},{data:points(2,x,300,t=>-bound(t)),color:colors.blue,dash:'6 4'},{data}],guides:[{y:0}],title:`Actual prime-count error and illustrative ±${c}√x ln(x) envelope`});let maxRatio=0;for(let n=2;n<=x;n++)maxRatio=Math.max(maxRatio,Math.abs(counts[n]-li(n))/(Math.sqrt(n)*Math.log(n)));$('error-out').innerHTML=`<p>At x = ${x}: π(x) = <strong>${counts[x]}</strong>, Li₂(x) ≈ ${fmt(li(x))}, E(x) ≈ <strong>${fmt(counts[x]-li(x))}</strong>.<br>Illustrative envelope there: ±${fmt(bound(x))}. Largest |E(n)|/(√n ln n) over integer 2 ≤ n ≤ ${x}: ${fmt(maxRatio,4)}.<br><strong>${maxRatio<=c?'Every tested integer is inside this envelope.':'Some tested integers are outside this envelope.'}</strong> Neither outcome settles an eventual bound or RH.</p>`;});
 if(id==='overview'){
 const concepts=[['Prime numbers','primes','Multiplicative building blocks'],['Prime-counting function','counting','Exact staircase π(x)'],['Prime Number Theorem','pnt','The smooth asymptotic trend'],['Infinite series','series','Limits of partial sums'],['Riemann zeta function','zeta','A function of an exponent'],['Euler product','euler','Integers connect to primes'],['Complex numbers','continuation','Inputs become plane coordinates'],['Analytic continuation','continuation','Extend the analytic function'],['ζ(−1) = −1/12','minus-twelfth','Illustration, not an RH premise'],['Nontrivial zeros','zeros','Zeros in the critical strip'],['Critical line','zeros','The middle line Re(s) = 1/2'],['Riemann Hypothesis','rh','Universal alignment: conjectural'],['Prime-counting error bounds','errors','Square-root scale: equivalent to RH']];$('concept-map').innerHTML=concepts.map(([name,dest,sub],i)=>`<li><button data-go="${dest}"><span class="label">${i+1} ${i<12?'→':''}</span>${name}<small>${sub}</small></button></li>`).join('');$('concept-map').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(lessons.findIndex(l=>l.id===b.dataset.go))));
 }
}
function bindZeroMarks(host,select,draw){$(host).querySelectorAll('[data-zero]').forEach(el=>{const choose=()=>{$(select).value=+el.dataset.zero-1;draw();};el.addEventListener('click',choose);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();}});});}
const answers=new Map();let current=0;
function showCheckpoint(){const l=lessons[current],answer=answers.get(l.id);if(answer===undefined)return;$('feedback').textContent=`${answer===l.check.correct?'Correct.':'Try again.'} ${l.check.why}`;document.querySelectorAll('.answers button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===answer)));updateNav();}
function updateNav(){let passed=0;lessons.forEach((l,i)=>{const b=$('nav-'+l.id);b.setAttribute('aria-current',i===current?'step':'false');const ok=answers.get(l.id)===l.check.correct;if(ok)passed++;b.classList.toggle('done',ok);});$('checkpoint-count').textContent=`${passed} / ${lessons.length} checkpoints understood`;}
function go(index,focus=true){
 activeDraw=null;current=Math.max(0,Math.min(lessons.length-1,index));const l=lessons[current];
 $('lesson').innerHTML=`<article aria-labelledby="lesson-title"><span class="eyebrow">${l.num==='Start'?'Before you begin':l.num==='Finish'?'The complete picture':'Step '+l.num} · Essential path</span><h1 id="lesson-title">${l.title}</h1><p class="lede">${l.intro}</p><div class="objective"><span class="label">Learning objective</span>${l.objective}</div>${l.body}<p class="question">${l.question}</p><section class="checkpoint" aria-labelledby="check-title"><span class="label">Pause and reason</span><h2 id="check-title">${l.check.q}</h2><div class="answers">${l.check.options.map((o,i)=>`<button type="button" data-answer="${i}" aria-pressed="false">${o}</button>`).join('')}</div><p class="feedback" id="feedback" role="status"></p></section><div class="footer-nav"><button id="prev" ${current===0?'disabled':''}>Previous</button><button class="primary" id="next" ${current===lessons.length-1?'disabled':''}>${current===0?'Begin with primes':'Next'}</button></div><p class="footer-note">${current===lessons.length-1?'End of course. Use the map or menu to revisit any concept.':'Continue at your own pace. Optional panels add depth without interrupting the essential path.'}</p></article>`;
 $('progress').value=current+1;$('progress-label').textContent=`${current+1} of ${lessons.length} · ${l.num==='Start'?'Prerequisites':l.num==='Finish'?'Overview':'Step '+l.num}`;
 document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{answers.set(l.id,+b.dataset.answer);showCheckpoint();}));$('prev').addEventListener('click',()=>go(current-1));$('next').addEventListener('click',()=>go(current+1));
 initViz(l.id);renderMath();showCheckpoint();updateNav();
 if(!window.katex){const warning=document.createElement('p');warning.id='math-warning';warning.textContent='Math typography could not load. Keep the accompanying assets/vendor/katex folder beside this page’s parent folder.';$('lesson').prepend(warning);}
 try{history.replaceState(null,'','#'+l.id);}catch(_){}document.title=`${l.title} · The Riemann Hypothesis`;
 document.querySelector('aside').classList.remove('open');$('menu-toggle').setAttribute('aria-expanded','false');if(focus){window.scrollTo(0,0);$('lesson').focus({preventScroll:true});}
}
window.addEventListener('DOMContentLoaded',()=>{
 $('nav-list').innerHTML=lessons.map((l,i)=>`<li><button id="nav-${l.id}" data-index="${i}"><span class="nav-num">${l.num}</span><span>${l.num==='Start'?'Prerequisites':l.num==='Finish'?'Connect everything':l.title.split(':')[0]}</span></button></li>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.index)));$('menu-toggle').addEventListener('click',()=>{const open=document.querySelector('aside').classList.toggle('open');$('menu-toggle').setAttribute('aria-expanded',String(open));});
 const requested=lessons.findIndex(l=>l.id===location.hash.slice(1));go(requested<0?0:requested,false);
});
</script>
